name: Caddy
version: "1.2.0"
slug: caddy
url: https://github.com/Aryza/caddy-ha
description: Caddy web server and reverse proxy with automatic HTTPS
arch:
  - aarch64
  - amd64
startup: services
boot: auto
stage: experimental
ports:
  80/tcp: 80
  443/tcp: 443
  443/udp: 443
ports_description:
  80/tcp: HTTP and automatic HTTPS certificate validation
  443/tcp: HTTPS
  443/udp: HTTP/3
map:
  - type: addon_config
    read_only: false
    path: /config
  - type: ssl
    read_only: true
options:
  caddyfile: ""
  cloudflare_api_token: ""
schema:
  caddyfile: str
  cloudflare_api_token: password
timeout: 30
